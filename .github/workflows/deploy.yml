name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [development, staging, production]
      image_tag:
        description: Container image tag
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ inputs.image_tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ inputs.image_tag }}

  deploy:
    name: Deploy and Verify
    runs-on: ubuntu-latest
    needs: publish
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deployment command placeholder
        run: |
          ./scripts/deploy.sh "${{ inputs.environment }}" "${{ inputs.image_tag }}"
      - name: Health check
        run: |
          ./scripts/healthcheck.sh "${{ inputs.environment }}"
      - name: Rollback on failure
        if: failure()
        run: |
          ./scripts/rollback.sh "${{ inputs.environment }}"
