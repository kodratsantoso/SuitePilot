name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Build, and Prisma Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: suitepilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/suitepilot
      JWT_SECRET: ci-jwt-secret-change-in-production-minimum-32-chars
      SESSION_SECRET: ci-session-secret-change-in-production-min-32
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./app/backend" db:generate
      - run: pnpm --filter "./app/backend" exec prisma validate
      - run: ./scripts/security-check.sh
      - run: pnpm --filter "./app/backend" db:migrate:prod
      - run: pnpm typecheck
      - run: pnpm build
      - name: Run backend tests
        run: pnpm --filter "./app/backend" test
      - name: Run Playwright E2E (smoke)
        uses: microsoft/playwright-github-action@v1
        with:
          run: npx playwright test --config=e2e/playwright.config.ts
      - name: Run k6 load smoke
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update && sudo apt-get install -y wget
          wget -q -O - https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm i -g k6
          k6 run load/k6/security_load_test.js --env LOAD_BASE_URL=http://localhost:3000 || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config
      - run: docker compose build backend frontend
